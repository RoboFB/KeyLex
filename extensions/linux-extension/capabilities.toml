# This extension's declared capabilities: which Keylex action ids it can
# carry out, and the native command string each maps to (see listener.js's
# COMMANDS map, which independently allowlists the same commands on the
# receiving end). Keylex controls both ends of this command string, so
# it's held to the enforced application.location.action shape -- see
# docs/protocol.md#native-command-strings.

[supports]
"shutdown" = "os.system.shutdown"
"show.desktop" = "os.desktop.show"
"move.left" = "os.window.move_left"
"move.right" = "os.window.move_right"
"close.window" = "os.window.close"
"create.desktop" = "os.desktop.create"
"go_to.next_desktop" = "os.desktop.next"
"go_to.previous_desktop" = "os.desktop.previous"
"send.next_desktop" = "os.window.move_to_next_desktop"
"send.previous_desktop" = "os.window.move_to_previous_desktop"
