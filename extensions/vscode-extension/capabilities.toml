# This extension's declared capabilities: which Keylex action ids it can
# carry out, and the real VS Code command id each maps to -- this is the
# curated, cross-app action vocabulary only (see docs/protocol.md#action-ids),
# a small hand-picked subset of everything the extension can actually do.
# The full command catalog (used by spotlight search / the list_actions
# handshake, and the keylex.spotlight QuickPick) is discovered live in
# extension.js instead, deliberately with no second hardcoded copy any
# more -- see docs/protocol.md#trust-model--authentication's "No
# per-command allowlist, by design".
#
# The values here are literal upstream VS Code API command ids
# (https://code.visualstudio.com/api/references/commands), fixed by
# Microsoft -- not ours to rename into the application.location.action
# shape the daemon otherwise enforces for command strings it invented
# itself (see config/targets.toml's `exempt_command_grammar` on this
# target, and docs/protocol.md#native-command-strings).

[supports]
"close.tab" = "workbench.action.closeActiveEditor"
"close.window" = "workbench.action.closeWindow"
"close.sidebar" = "workbench.action.closeSidebar"
"close.pane" = "workbench.action.closePanel"
"close.terminal" = "workbench.action.terminal.kill"
"duplicate.line" = "editor.action.copyLinesDownAction"
"go_to.definition" = "editor.action.revealDefinition"
"comment.line" = "editor.action.commentLine"
"save" = "workbench.action.files.save"
