# Action vocabulary: one entry per action, with its keyboard trigger (if
# any) and its fallback behavior when the focused app has no native
# adapter for it.
#
# modifier/location: the action's id, built from two validated word
#                 lists in vocabulary.toml -- `modifier` (a verb, e.g.
#                 "close") plus an optional `location` (the thing it
#                 acts on, e.g. "tab"). The id itself
#                 (`<modifier>` or `<modifier>.<location>`) is derived,
#                 never written by hand -- Registry::load rejects any
#                 word not in vocabulary.toml. See
#                 docs/protocol.md#action-ids for the full grammar.
# key:            "ctrl+w"-style combo that triggers this action. A combo
#                 that matches a key here is always consumed (never reaches
#                 the OS/app directly) and re-emitted only via the fallback
#                 path below. Omit for actions not yet bound to a key.
# chord:          array of two+ key tokens (same vocabulary as `key`,
#                 including modifiers) that must all be held down together,
#                 order-independent -- e.g. ["ctrl", "d", "f"]. Mutually
#                 exclusive with `key`. See docs/protocol.md#chorded-triggers.
# fallback_tier:  silent | notify_attempt | notify_only
# fallback_keycode: same "ctrl+w"-style combo, sent system-wide when there's
#                 no native adapter for the focused app.

[[action]]
modifier = "save"
key = "ctrl+s"
fallback_tier = "silent"
fallback_keycode = "ctrl+s"

[[action]]
modifier = "close"
location = "tab"
key = "ctrl+w"
fallback_tier = "silent"
fallback_keycode = "ctrl+w"

# window/sidebar/pane/terminal have no safe, cross-app keycode guess (e.g.
# a wrongly guessed alt+f4 would be destructive) -> notify_only, so they
# only ever work through a real adapter.
[[action]]
modifier = "close"
location = "window"
fallback_tier = "notify_only"

[[action]]
modifier = "close"
location = "sidebar"
fallback_tier = "notify_only"

[[action]]
modifier = "close"
location = "pane"
fallback_tier = "notify_only"

[[action]]
modifier = "close"
location = "terminal"
fallback_tier = "notify_only"

[[action]]
modifier = "go_to"
location = "definition"
fallback_tier = "notify_only"   # no meaningful global keycode guess

[[action]]
modifier = "duplicate"
location = "line"
fallback_tier = "notify_attempt"
fallback_keycode = "ctrl+shift+d"

[[action]]
modifier = "comment"
location = "line"
fallback_tier = "notify_only"

[[action]]
modifier = "toggle"
location = "pane"
chord = ["d", "f"]
fallback_tier = "notify_only"

# Pure OS combos with no target app needed -- always run via the fallback
# sender.
[[action]]
modifier = "show"
location = "desktop"
key = "prtsc"
fallback_tier = "silent"
fallback_keycode = "win+d"

[[action]]
modifier = "reset"
location = "graphics_driver"
key = "win+ctrl+shift+b"
fallback_tier = "silent"
fallback_keycode = "win+ctrl+shift+b"

# Handled by the OS-wide system listener (extensions/linux-extension or
# extensions/windows-extension, see config/targets.toml's system-linux /
# system-windows targets) rather than a keycode -- destructive, so no key
# is bound by default and there's no keycode fallback to guess with.
[[action]]
modifier = "shutdown"
fallback_tier = "notify_only"

# Window snap/move -- there's no keycode guess that's safe *and* reliable
# across window managers (unlike win+d for show.desktop), so these only
# work through the system listener too.
[[action]]
modifier = "move"
location = "left"
key = "win+left"
fallback_tier = "notify_only"

[[action]]
modifier = "move"
location = "right"
key = "win+right"
fallback_tier = "notify_only"
