# The action-id vocabulary: every `modifier`/`location` pair in
# actions.toml must be built from these two lists -- Registry::load
# rejects any action whose modifier or location isn't listed here. This
# is what makes action ids a real, checked grammar instead of hand-typed
# opaque strings: `<modifier>` alone (e.g. "save", "shutdown") or
# `<modifier>.<location>` (e.g. "close.tab"), nothing else. See
# docs/protocol.md for the full rationale.

modifiers = [
    "save", "close", "open", "duplicate", "comment", "toggle",
    "go_to", "move", "show", "reset", "shutdown",
]

locations = [
    "tab", "window", "sidebar", "pane", "terminal", "line",
    "definition", "desktop", "graphics_driver", "left", "right",
]
