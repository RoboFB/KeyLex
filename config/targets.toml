# Output side: per target program, which actions it supports (whitelist)
# and how the adapter reaches it.
#
# Both local IPC adapters (socket, websocket) require every message to
# carry the shared secret the daemon generates on first run at
# <config-dir>/secret.token (git-ignored, never checked in -- see
# docs/protocol.md#trust-model--authentication). Nothing here configures
# the token itself; it's loaded automatically from that fixed path.

[[target]]
program = "vscode"
match_process = ["Code.exe", "code"]
adapter = "socket"
address = "127.0.0.1:7777"

  [target.supports]
  "close.tab" = "workbench.action.closeActiveEditor"
  "close.window" = "workbench.action.closeWindow"
  "close.sidebar" = "workbench.action.closeSidebar"
  "close.pane" = "workbench.action.closePanel"
  "close.terminal" = "workbench.action.terminal.kill"
  "duplicate.line" = "editor.action.copyLinesDownAction"
  "go_to.definition" = "editor.action.revealDefinition"
  "comment.line" = "editor.action.commentLine"
  "save" = "workbench.action.files.save"

[[target]]
program = "chrome"
match_process = ["chrome.exe", "chrome"]
adapter = "websocket"
port = 7778
# Placeholder -- replace with the real extension ID after loading it
# unpacked (chrome://extensions/), so the daemon rejects any WebSocket
# handshake from a browser tab/page other than this extension. See
# extensions/chrome-extension/README.md for how to get a ***stable*** ID (otherwise
# it changes on every dev reload). Comment this line out entirely to skip
# the Origin check (not recommended -- see docs/protocol.md).
allowed_origin = "chrome-extension://REPLACE_WITH_REAL_EXTENSION_ID"

  [target.supports]
  "close.tab" = "chrome.tab.close"
  "close.window" = "chrome.window.close"
  "close.sidebar" = "chrome.sidepanel.toggle"

[[target]]
program = "neovim"
match_process = ["nvim"]
adapter = "rpc"
socket_env = "NVIM_LISTEN_ADDRESS"

  [target.supports]
  "close.tab" = "bd"
  "save" = "w"
  "duplicate.line" = "normal yyp"

# OS-wide system listeners -- independent of the focused program, matched by
# `os` (against std::env::consts::OS) rather than `match_process`. Each is a
# small standalone script under extensions/<os>-extension/ that speaks the
# same keylex/v0 socket protocol as the vscode target above; run it alongside
# the daemon (see that folder's README.md). Only the entry matching the OS
# the daemon is actually running on is ever used (Registry::system_target).
[[target]]
program = "system-linux"
os = "linux"
adapter = "socket"
address = "127.0.0.1:7779"

  [target.supports]
  "system.shutdown" = "shutdown"
  "system.show_desktop" = "show_desktop"
  "window.move_left" = "move_left"
  "window.move_right" = "move_right"

[[target]]
program = "system-windows"
os = "windows"
adapter = "socket"
address = "127.0.0.1:7780"

  [target.supports]
  "system.shutdown" = "shutdown"
  "system.show_desktop" = "show_desktop"
  "window.move_left" = "move_left"
  "window.move_right" = "move_right"

# System-wide actions, independent of the focused program.
[[system_action]]
id = "system.reset_graphics_driver"
os = "windows"
keycode = "win+ctrl+shift+b"
