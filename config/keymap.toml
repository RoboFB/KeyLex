# Skeleton input-device keymap: every physical key on a standard US
# (en-US) 104/105-key keyboard, left column being evdev's own native key
# name (the same `evdev::Key::KEY_*` constants `src/capture/linux.rs`
# already uses internally) mapped to an empty Keylex "nice name" -- the
# short token that would appear in `actions.toml`'s `key`/`chord`/
# `fallback_keycode` fields and `targets.toml`, once a name is chosen.
#
# Not wired into the loader yet -- `token_to_key`/`key_to_token` in
# `src/capture/linux.rs` currently only resolve a-z, 0-9, and `prtsc`
# ("Prototype scope ... full layout support is a later step", per that
# file's own comment), plus `ctrl`/`shift`/`alt`/`win` for modifiers
# (`MODIFIER_NAMES` in `src/config.rs`). Those four modifier names and the
# existing single-character a-z/0-9 convention are worth keeping for
# whatever naming scheme goes in the values below, so the existing
# `actions.toml` entries (`"ctrl+w"`, `"win+left"`, etc.) don't need
# renaming.
#
# This file is en-US only. A different physical layout (or a second
# input device) would get its own file alongside this one, not a column
# added here.

