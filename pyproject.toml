[project]
name = "keylex"
version = "0.1.0"
description = "Dispatch abstract verb+object actions to per-app native commands, with keycode fallback."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
linux = ["evdev>=1.6"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
