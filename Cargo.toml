[package]
name = "keylex"
version = "0.1.0"
edition = "2021"
description = "Dispatch abstract actions to per-app native commands, with keycode fallback."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# Already resolved transitively via tungstenite's handshake feature (HTTP
# types) -- promoted to a direct dep for the websocket Origin check, no new
# supply-chain surface added.
http = "1"
# Pure computation, no OS bindings -- the same fuzzy-ranking logic behind
# the `nucleo`/helix fuzzy finder, used here for the spotlight action
# search (src/spotlight.rs). Works identically on Linux/macOS/Windows.
nucleo-matcher = "0.3"
# Cross-platform terminal input/render for the interactive spotlight
# launcher (`keylex --spotlight`) -- same crate, no cfg(target_os) needed.
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# The small popup window `keylex --spotlight-daemon` raises on its global
# hotkey (src/spotlight/gui.rs) -- a real GUI window rather than a terminal
# UI, since the daemon has no controlling terminal to draw into. `glow`
# (OpenGL) avoids pulling in `wgpu`'s much larger dependency tree; `x11`
# and `wayland` cover both Linux display servers, and Windows needs neither
# feature flag (`winit` picks its Win32 backend automatically).
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
# Already resolved transitively via eframe's `x11` feature (winit's X11
# backend) -- promoted to a direct dependency for `hotkey::linux`'s
# `XGrabKey` global hotkey, no new supply-chain surface added.
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
] }

[[bin]]
name = "keylex"
path = "src/main.rs"
