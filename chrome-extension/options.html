<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Keylex Chrome Adapter</title>
    <style>
      body { font: 13px system-ui, sans-serif; max-width: 32em; margin: 2em; }
      input { width: 100%; box-sizing: border-box; font-family: monospace; }
      p { color: #555; }
    </style>
  </head>
  <body>
    <h3>Keylex daemon token</h3>
    <p>
      Paste the contents of <code>secret.token</code> from the Keylex
      daemon's config directory (generated on first run -- see
      <code>../docs/protocol.md#trust-model--authentication</code>). Required
      before this extension can connect: a browser extension can't read the
      file off disk itself.
    </p>
    <input id="token" type="text" spellcheck="false" autocomplete="off" />
    <p><button id="save">Save</button> <span id="status"></span></p>
    <script src="options.js"></script>
  </body>
</html>
