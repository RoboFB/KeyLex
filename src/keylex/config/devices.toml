# Input-Seite: welche Geräte werden abgehört und wie werden ihre
# Rohsignale in interne Events übersetzt. Physische Tasten werden
# über Scancode-Positionen referenziert (layout-unabhängig), nicht
# über Buchstaben.
#
# mode pro Binding (default: "observe", wenn weder Binding noch Device
# einen Wert setzt):
#   grab    - Taste wird exklusiv abgefangen; das OS/die App sieht sie nur,
#             wenn Keylex sie über den Fallback re-emittiert.
#   observe - Binding kommt zusätzlich zum normalen OS-Verhalten, die Taste
#             bleibt für alle anderen Programme unverändert nutzbar.

[[device]]
id = "main_keyboard"
type = "keyboard"
# Linux: evdev-Pfad, Windows: wird über den Low-Level-Hook erkannt
source = "auto"
default_mode = "observe"

  [[device.binding]]
  # physische Taste + Modifier -> interne Event-ID
  key = "b"
  modifiers = ["win", "ctrl", "shift"]
  event = "system.reset_graphics_driver"
  # kein Konflikt mit Standardverhalten -> observe reicht (Default)

  [[device.binding]]
  key = "w"
  modifiers = ["ctrl"]
  event = "close.tab"
  mode = "grab"   # soll ctrl+w systemweit ersetzen, nicht nur ergänzen

  [[device.binding]]
  key = "prtsc"
  modifiers = []
  event = "system.show_desktop"
  mode = "grab"   # simples Beispiel ohne Zielprogramm: Druck-Taste -> Win+D

[[device]]
id = "streamdeck_1"
type = "streamdeck"
source = "usb:0fd9:0060"   # Vendor:Product-ID, Beispielwert
default_mode = "grab"      # Stream-Deck-Tasten haben kein eigenes OS-Verhalten

  [[device.binding]]
  button = 1
  event = "close.tab"

  [[device.binding]]
  button = 2
  event = "go_to.definition"

[[device]]
id = "space_mouse"
type = "spacemouse"
source = "spacenavd:default"
default_mode = "grab"

  [[device.binding]]
  button = "left"
  event = "toggle.pane"
