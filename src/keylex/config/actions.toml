# Geräteunabhängiges Aktions-Vokabular: Verb + Objekt.
# fallback_tier: silent | notify_attempt | notify_only
# fallback_keycode: optionaler, global sinnvoller Keycode-Rateversuch

[[verb]]
name = "close"
objects = ["tab", "window", "file", "sidebar", "pane", "terminal"]

[[verb]]
name = "duplicate"
objects = ["line", "tab", "pane"]

[[verb]]
name = "go_to"
objects = ["definition", "declaration", "line", "reference"]

[[verb]]
name = "comment"
objects = ["line", "selection", "file"]

[[verb]]
name = "toggle"
objects = ["pane", "sidebar", "terminal"]

# Einzelne Overrides für Fallback-Verhalten (sonst: notify_attempt als Default)
[[action]]
id = "save"
fallback_tier = "silent"
fallback_keycode = "ctrl+s"

[[action]]
id = "close.tab"
fallback_tier = "silent"
fallback_keycode = "ctrl+w"

# window/sidebar/pane/terminal haben keinen sicheren, app-übergreifenden
# Keycode-Rateversuch (z.B. wäre ein falsch geratenes alt+f4 destruktiv) ->
# notify_only, damit sie nur über einen echten Adapter funktionieren.
[[action]]
id = "close.window"
fallback_tier = "notify_only"

[[action]]
id = "close.sidebar"
fallback_tier = "notify_only"

[[action]]
id = "close.pane"
fallback_tier = "notify_only"

[[action]]
id = "close.terminal"
fallback_tier = "notify_only"

[[action]]
id = "go_to.definition"
fallback_tier = "notify_only"   # kein sinnvoller globaler Keycode

[[action]]
id = "duplicate.line"
fallback_tier = "notify_attempt"
fallback_keycode = "ctrl+shift+d"

# system.*-IDs sind von der Verb+Objekt-Grammatik ausgenommen (siehe
# Registry._validate_action_grammar) -- reine OS-Kombinationen, kein Ziel-App
# nötig, laufen immer über den Fallback-Sender.
[[action]]
id = "system.show_desktop"
fallback_tier = "silent"
fallback_keycode = "win+d"
